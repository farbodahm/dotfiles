# Plain lock screen: dark forest photo, clock, date, password field.
# Original KoolDots version: hyprlock.conf.bak-kooldots

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = $HOME/Pictures/wallpapers/nature-high-fens-forest.jpg
    color = rgb(20, 20, 20)
    blur_passes = 1
    blur_size = 3
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.0
}

# Time (explicit TZ so it is right even if the system zone drifts)
label {
    monitor =
    text = cmd[update:1000] TZ=Europe/Amsterdam date +%H:%M
    color = rgba(235, 235, 235, 0.95)
    font_size = 96
    font_family = JetBrains Mono Light
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] TZ=Europe/Amsterdam LC_TIME=en_GB.UTF-8 date +"%A %-d %B"
    color = rgba(200, 200, 200, 0.8)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 4
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(15, 15, 15, 0.6)
    font_color = rgb(220, 220, 220)
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgb(200, 90, 90)
    capslock_color = rgb(215, 175, 95)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">password</span>
    fail_text = <span foreground="##ffffff99">wrong password</span>
    font_family = JetBrains Mono
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Keyboard layout (you have us + ir), only worth a glance before typing
label {
    monitor =
    text = $LAYOUT
    color = rgba(200, 200, 200, 0.5)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, -110
    halign = center
    valign = center
}
