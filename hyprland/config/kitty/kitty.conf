# Plain kitty. Original: kitty.conf.bak-kooldots
include ./kitty-themes/Tomorrow_Night.conf

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Nerd Font glyphs (icons in prompts etc.) come from the Nerd Font build
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF JetBrainsMono Nerd Font

background_opacity 1.0
dynamic_background_opacity yes

cursor_shape         block
cursor_blink_interval 0
cursor_trail         0

window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000
wheel_scroll_min_lines 1
allow_remote_control yes
linux_display_server auto
